<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flujo de Pasos</title>
  
  <!-- Aquí es donde enlazarás tu archivo CSS más adelante -->
  <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>

  <!-- Contenedor principal de los pasos -->
  <ol class="process-flow">
    
    <!-- Paso 1 -->
    <li class="step-card">
      <span class="step-label">paso 1</span>
      <h2 class="step-title">Llego y me ubico</h2>
    </li>

    <!-- Paso 2 -->
    <li class="step-card">
      <span class="step-label">paso 2</span>
      <h2 class="step-title">Conozco al equipo</h2>
    </li>

    <!-- Paso 3 -->
    <li class="step-card">
      <span class="step-label">paso 3</span>
      <h2 class="step-title">Veo qué hacen</h2>
    </li>

    <!-- Paso 4 -->
    <li class="step-card">
      <span class="step-label">paso 4</span>
      <h2 class="step-title">Me conecto</h2>
    </li>

    <!-- Paso 5 -->
    <li class="step-card">
      <span class="step-label">paso 5</span>
      <h2 class="step-title">Estilo y diseño adaptable — la base que sostiene todo</h2>
    </li>

  </ol>

</body>
</html>
